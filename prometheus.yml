global:
  scrape_interval: 5s

scrape_configs:

  - job_name: 'spring-app'
    metrics_path: '/SpringMVC/actuator/prometheus'
    static_configs:
      - targets: ['app:8089']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']